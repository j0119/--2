<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 — 寵物合夥人</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./header.css">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--light);

        }


        /* ── Main ── */
        .login-main {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
            background-color: var(--light);
            padding: 60px 80px;
        }

        /* 左側 */
        .login-left {
            flex: 0 1 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--white);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-subtitle {

            color: var(--text);
            letter-spacing: 0.05em;
        }

        .login-title {

            font-weight: 700;
            color: var(--dark);
            margin-top: -8px;
        }

        /* Google 按鈕 */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 11px 0;
            background: var(--white);
            border: 1.5px solid var(--light);
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            color: var(--text);
            transition: border-color 0.2s, background 0.2s;
        }

        .btn-google:hover {
            border-color: var(--standout);
            background: var(--light);
        }

        .btn-google svg {
            flex-shrink: 0;
        }

        /* 分隔線 */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: var(--light);
        }

        /* 輸入欄 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 0.05em;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap input {
            width: 100%;
            padding: 10px 16px;

            border-radius: 10px;
            font-family: inherit;
            background: var(--white);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrap input:focus {
            border-color: var(--white);
        }

        .input-wrap input::placeholder {
            color: var(--grayscale);
        }

        .btn-eye {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            padding: 0;
        }

        .btn-eye:hover {
            color: var(--standout);
        }

        /* 登入按鈕 */
        .btn-submit {
            width: 100%;
            padding: 12px 0;
            background: var(--dark);
            color: var(--white);
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--standout);
        }

        /* 底部連結 */
        .login-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .login-links a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
            font-size: 14px;
        }

        .login-links a:hover {
            color: var(--standout);
        }

        .login-links .register-link a {
            color: var(--text);
            font-weight: 700;
            font-size: 14px;
        }

        .register-link {
            font-size: 14px;
        }

        /* 右側圖片 */
        .login-right {
            flex: 0 1 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: flex-end;
        }

        .login-right img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <!-- ── Navbar ── -->
    <input type="checkbox" id="nav-control">
    <div class="main-header">
        <div><a class="logo" href="./index.html"><img src="./logo.png" alt="logo"></a></div>
        <nav class="nav">

            <ul class="nav-links">

                <li><a class="btn-test" id="btn-test_explain" href="./test-explain.html">配對測驗</a></li>
                <li><a class="btn-encyclopedia" id="btn-encyclopedia" href="./encyclopedia.html">寵物百科</a></li>
                <li><a class="btn-index" id="btn-index" href="#">虛擬寵物</a></li>
                <li><a class="btn-takeMeHome" id="btn-takeMeHome" href="#">帶我回家</a></li>
                <li><a class="btn-comminicate" id="btn-comminicate" href="./comminicate.html">交流平台</a></li>
                <li><a class="btn-login" id="btn-login" href="./login.html">登入</a></li>
            </ul>
        </nav>
        <label for="nav-control" class="hb">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </label>
    </div>

    <!-- ── Main ── -->
    <main class="login-main">

        <!-- 左側：登入卡片 -->
        <div class="login-left">
            <div class="login-card">
                <p class="login-subtitle">繼續你的尋找旅程</p>
                <h1 class="login-title">歡迎回來</h1>

                <!-- Google 登入 -->
                <button class="btn-google">
                    <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
                            fill="#4285F4" />
                        <path
                            d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"
                            fill="#34A853" />
                        <path
                            d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
                            fill="#FBBC05" />
                        <path
                            d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"
                            fill="#EA4335" />
                    </svg>
                    使用Google帳號登入
                </button>

                <!-- 分隔線 -->
                <div class="divider">
                    <span></span>
                    或使用電子郵件
                    <span></span>
                </div>

                <!-- 帳號 -->
                <div class="input-group">
                    <label for="email">帳 號</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="your@email.com">
                    </div>
                </div>

                <!-- 密碼 -->
                <div class="input-group">
                    <label for="password">密 碼</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="請區分大小寫">
                        <button class="btn-eye" id="btn-eye" type="button" onclick="togglePassword()">
                            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 登入按鈕 -->
                <button class="btn-submit">登入</button>

                <!-- 底部連結 -->
                <div class="login-links">
                    <a href="#">忘記密碼</a>
                    <p class="register-link">還沒有帳號？<a href="#">立即註冊</a></p>
                </div>
            </div>
        </div>

        <!-- 右側：圖片 -->
        <div class="login-right">
            <img src="./picture/2 login/02.png" alt="貓咪與狗狗">
        </div>

    </main>



    <!-- ── Footer ── -->
    <footer class="main-footer">
        <div class="container">
            <div class="row">
                <div class="col-4 col-md-4">
                    <a class="nav_logo" href="./index.html"><img src="./logo.png" alt="logo"></a>
                    <h3 class="footer-logo">寵物合夥人</h3>
                    <p class="footer-tagline">每段陪伴，都值得被認真開始。</p>
                </div>

                <div class="col-4 col-md-4">
                    <h4 class="footer-section-title">聯絡我們</h4>
                    <span class="footer-text">
                        <p>服務時間：09:00 - 18:00
                        <p>聯絡信箱：qwwerrt@gmail.com
                        <p>聯絡電話：0900000000
                    </span>
                </div>

                <div class="col-4 col-md-4 footer-links">
                    <h4 class="footer-section-title">快速連結</h4>
                    <ul class="footer-links">
                        <li><a class="btn-test" id="btn-test_explain" href="./test-explain.html">配對測驗</a></li>
                        <li><a class="btn-encyclopedia" id="btn-encyclopedia" href="./encyclopedia.html">寵物百科</a></li>
                        <li><a class="btn-index" id="btn-index" href="#">虛擬寵物</a></li>
                        <li><a class="btn-takeMeHome" id="btn-takeMeHome" href="#">帶我回家</a></li>
                        <li><a class="btn-comminicate" id="btn-comminicate" href="./comminicate.html">交流平台</a></li>
                    </ul>
                </div>

                <div class="col-12">
                    <div class="footer-bottom">
                        © 2026 寵物合夥人．All rights reserved.
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }
    </script>

</body>

</html>
